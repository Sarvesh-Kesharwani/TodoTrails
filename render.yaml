services:
  - type: web
    name: todotrails-attachments
    runtime: node
    plan: free
    rootDir: render-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://todotrails.vercel.app
      - key: UPLOAD_DIR
        value: /opt/render/project/src/render-backend/uploads
